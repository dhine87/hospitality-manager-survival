<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30-Second AI Assist</title><style>body{font-family:Arial,sans-serif;background:#071827;color:#fff;margin:0;padding:20px}.wrap{max-width:720px;margin:auto}.card{background:#fff;color:#071827;border-radius:18px;padding:22px;margin:18px 0}h1{font-size:28px}.yellow{color:#FFD91A}.btn{display:inline-block;background:#FFD91A;color:#071827;padding:14px 18px;border-radius:12px;font-weight:700;text-decoration:none;border:0;cursor:pointer;margin:6px}.secondary{background:#dcebff}.prompt{background:#f4f7fa;border-left:6px solid #f21d2f;padding:16px;border-radius:8px;font-size:18px;line-height:1.35}.learn{border-left-color:#1687f8}</style></head><body><div class="wrap"><h1><span class="yellow" id="num"></span><br><span id="title"></span></h1><div class="card"><h2>HELP ME NOW</h2><div class="prompt" id="live"></div><button class="btn" onclick="copyText('live')">Copy Quick Prompt</button><a class="btn secondary" href="https://chatgpt.com/" target="_blank">Open ChatGPT</a></div><div class="card"><h2>LEARN FROM IT</h2><div class="prompt learn" id="learn"></div><button class="btn" onclick="copyText('learn')">Copy Coach Prompt</button></div><p>AI is a thinking partner, not company policy. Follow your organisation's safety, legal and operational procedures.</p></div><script>const D={6:["We're Behind On The Close","We close at [time]. I have [number] staff and we're behind on [main outstanding jobs]. Give me the quickest sensible recovery plan.","We fell behind on tonight's close, mainly with [tasks]. Help me identify what should have happened earlier and build a better closing sequence for next time."],7:["A Customer Is Furious","A customer is furious because [reason]. They want [resolution]. Tell me what to say and do next.","I handled a difficult complaint today about [issue]. I responded by [what you did]. Coach me on what I did well and what I could handle better next time."],8:["Two Team Members Are Arguing","Two team members are arguing about [issue] and it's affecting the shift. Tell me what I should do right now.","Two team members had a conflict today about [issue]. Help me separate facts from assumptions and plan a fair follow-up conversation."],9:["Someone Isn't Pulling Their Weight","One team member isn't pulling their weight. What I'm actually seeing is [specific behaviour]. Help me address it fairly.","I'm concerned about a team member's performance because I've repeatedly seen [examples]. Help me determine whether this looks like training, expectations, capability or behaviour, and prepare a fair coaching conversation."],10:["Someone Wants To Go Home Early","Someone wants to leave at [time] because [reason]. That would leave me with [number] staff. Help me decide what to consider.","Someone asked to leave early today because [reason]. I decided [decision]. Help me review whether I handled the operational and people-management sides fairly."],11:["The New Starter Is Struggling","My new starter is struggling with [task] and we're [quiet/normal/busy]. Give me ONE thing to focus on with them right now.","My new starter struggled with [tasks] today but did well at [strengths]. Build me a simple next-shift coaching plan with no more than three priorities."],12:["The Delivery Just Arrived","The delivery just arrived. We're [quiet/normal/busy], I have [number] staff, and the delivery is [small/medium/large + chilled/frozen/general]. Help me handle it with minimum disruption.","Today's delivery disrupted the shift because [what happened]. Help me create a better delivery routine that protects both correct stock handling and customer service."],13:["Equipment Has Gone Down","Our [equipment] has stopped working. We can still [what remains available]. Help me adapt the shift safely.","Our [equipment] failed today and it affected [products/service]. Help me create a simple contingency plan for the next time this equipment fails."],14:["We're Missing The Sales Target","We're £[amount] behind target with [hours] left. Trade is currently [quiet/normal/busy]. Give me THREE sensible things the team can influence right now.","We missed today's sales target by £[amount]. Help me investigate whether traffic, transaction value, availability, product mix or execution contributed before recommending what we change."],15:["Waste Is Too High","We're wasting too much [product/category]. The main pattern I've noticed is [pattern/unknown]. Tell me what I should investigate first.","Waste is repeatedly high on [products]. Help me investigate the root cause and design ONE change we can test for seven days before deciding whether it worked."]};let n=+new URLSearchParams(location.search).get('card'),d=D[n]||D[6];num.textContent='CARD '+String(n).padStart(2,'0');title.textContent=d[0];live.textContent=d[1];learn.textContent=d[2];function copyText(id){navigator.clipboard.writeText(document.getElementById(id).innerText).then(()=>alert('Prompt copied'));}</script></body></html>
